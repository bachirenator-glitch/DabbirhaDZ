name: Build Dabbirha DZ APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: unzip -q DabbirhaDZ_PHONE_BUILD.zip -d source

      - name: Fix project
        run: |
          cd source/DabbirhaDZ
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/dz/dabbirha/app/MainActivity.kt")
          s = p.read_text()

          if "import androidx.compose.material3.Surface" not in s:
              s = "import androidx.compose.material3.Surface\n" + s
              p.write_text(s)

          g = Path("app/build.gradle.kts")
          s = g.read_text()

          s += """

kotlin {
    jvmToolchain(17)
}

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
"""
          g.write_text(s)
          PY

      - name: Build APK
        working-directory: source/DabbirhaDZ
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DabbirhaDZ-APK
          path: source/DabbirhaDZ/app/build/outputs/apk/debug/app-debug.apk
