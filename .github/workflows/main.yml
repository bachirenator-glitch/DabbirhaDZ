name: Build Dabbirha DZ APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q DabbirhaDZ_PHONE_BUILD.zip -d source

      - name: Fix JVM target and Surface import
        working-directory: source/DabbirhaDZ
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()

          if "kotlin { jvmToolchain(17) }" not in s:
              s += "\n\nkotlin { jvmToolchain(17) }\n"

          if "JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }"""
              )

          gradle.write_text(s)

          main = Path("app/src/main/java/dz/dabbirha/app/MainActivity.kt")
          s = main.read_text()

          if "import androidx.compose.material3.Surface" not in s:
              marker = "import "
              pos = s.find(marker)
              if pos >= 0:
                  s = s[:pos] + "import androidx.compose.material3.Surface\n" + s[pos:]

          main.write_text(s)
          PY

      - name: Build APK
        working-directory: source/DabbirhaDZ
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DabbirhaDZ-APK
          path: source/DabbirhaDZ/app/build/outputs/apk/debug/app-debug.apk
